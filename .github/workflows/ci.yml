name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: make cover-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go test -tags=integration -race -count=1 -run TestLive ./integration/...
        env:
          EDGECENTER_RMON_BASE_URL: ${{ secrets.EDGECENTER_RMON_BASE_URL }}
          EDGECENTER_RMON_API_KEY: ${{ secrets.EDGECENTER_RMON_API_KEY }}
          EDGECENTER_RMON_TEST_CHANNEL_RECEIVER: ${{ secrets.EDGECENTER_RMON_TEST_CHANNEL_RECEIVER }}
          EDGECENTER_RMON_TEST_CHANNEL_TOKEN: ${{ secrets.EDGECENTER_RMON_TEST_CHANNEL_TOKEN }}
          EDGECENTER_RMON_TEST_PLACE: ${{ secrets.EDGECENTER_RMON_TEST_PLACE }}
          EDGECENTER_RMON_TEST_ENTITY: ${{ secrets.EDGECENTER_RMON_TEST_ENTITY }}
