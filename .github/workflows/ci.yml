name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - run: make cover-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - run: go test -tags=integration -race -count=1 -run TestLive ./integration/...
        env:
          EDGECENTER_RMON_BASE_URL: ${{ secrets.EDGECENTER_RMON_BASE_URL }}
          EDGECENTER_RMON_API_KEY: ${{ secrets.EDGECENTER_RMON_API_KEY }}
          EDGECENTER_RMON_TEST_CHANNEL_RECEIVER: ${{ secrets.EDGECENTER_RMON_TEST_CHANNEL_RECEIVER }}
          EDGECENTER_RMON_TEST_CHANNEL_TOKEN: ${{ secrets.EDGECENTER_RMON_TEST_CHANNEL_TOKEN }}
          EDGECENTER_RMON_TEST_PLACE: ${{ secrets.EDGECENTER_RMON_TEST_PLACE }}
          EDGECENTER_RMON_TEST_ENTITY: ${{ secrets.EDGECENTER_RMON_TEST_ENTITY }}
